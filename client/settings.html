<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Student Expense Tracker</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <div class="sidebar-brand-title">Student Expense</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Overview</div>
        <a href="dashboard.html" class="nav-item"><span>📊 Dashboard</span></a>
        <a href="transactions.html" class="nav-item"><span>💳 Transactions</span></a>
        <div class="nav-section-label">Planning</div>
        <a href="budgets.html" class="nav-item"><span>🎯 Monthly Budgets</span></a>
        <a href="goals.html" class="nav-item"><span>🏆 Savings Goals</span></a>
        <a href="recurring.html" class="nav-item"><span>🔄 Subscriptions & Bills</span></a>
        <div class="nav-section-label">Insights</div>
        <a href="analytics.html" class="nav-item"><span>📈 Analytics & Trends</span></a>
        <a href="settings.html" class="nav-item active"><span>⚙️ Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar" id="nav-user-avatar">S</div>
          <div class="user-info">
            <div class="user-name" id="nav-user-name">Student</div>
            <div class="user-email" id="nav-user-email">student@campus.edu</div>
          </div>
          <button onclick="Auth.logout()" title="Logout" style="background:none; border:none; color:var(--text-sidebar); cursor:pointer;">🚪</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="app-main">
      <header class="app-header">
        <h2 style="font-size: 1.25rem;">Account & App Settings</h2>
      </header>

      <div class="app-content" style="max-width: 680px;">
        <div class="card mb-6">
          <h3 class="card-title">Student Profile</h3>
          <form id="profile-settings-form">
            <div class="form-group">
              <label class="form-label" for="settings-fullname">Full Name</label>
              <input type="text" id="settings-fullname" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="settings-email">Email Address</label>
              <input type="email" id="settings-email" class="form-control" disabled style="background: var(--bg-muted); cursor: not-allowed;">
            </div>
            <div class="form-group">
              <label class="form-label" for="settings-currency">Display Currency</label>
              <select id="settings-currency" class="form-control">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="CAD">CAD ($)</option>
                <option value="AUD">AUD ($)</option>
                <option value="INR">INR (₹)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="settings-target-budget">Overall Monthly Budget Target</label>
              <input type="number" step="0.01" id="settings-target-budget" class="form-control" placeholder="e.g. 800.00">
            </div>
            <button type="submit" class="btn btn-primary mt-2">Save Profile Changes</button>
          </form>
        </div>

        <div class="card">
          <h3 class="card-title text-danger">Session & Security</h3>
          <p class="text-muted mb-4">Log out from your current device session.</p>
          <button onclick="Auth.logout()" class="btn btn-danger">Log Out</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guards.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.renderUserNav();
      const user = Auth.getUser();
      const profile = Auth.getProfile();

      if (user) {
        document.getElementById('settings-email').value = user.email || '';
      }
      if (profile) {
        document.getElementById('settings-fullname').value = profile.full_name || '';
        document.getElementById('settings-currency').value = profile.currency || 'USD';
        document.getElementById('settings-target-budget').value = profile.monthly_budget_target || '';
      }

      // Try refreshing profile from API
      try {
        const res = await Api.get('/auth/profile');
        if (res.data) {
          localStorage.setItem(CONFIG.STORAGE_KEYS.PROFILE, JSON.stringify(res.data));
          document.getElementById('settings-fullname').value = res.data.full_name || '';
          document.getElementById('settings-currency').value = res.data.currency || 'USD';
          document.getElementById('settings-target-budget').value = res.data.monthly_budget_target || '';
        }
      } catch (e) {
        console.warn('Could not refresh profile:', e);
      }

      document.getElementById('profile-settings-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('settings-fullname').value.trim();
        const currency = document.getElementById('settings-currency').value;
        const monthlyBudgetTarget = parseFloat(document.getElementById('settings-target-budget').value) || 0;

        try {
          const res = await Api.put('/auth/profile', { fullName, currency, monthlyBudgetTarget });
          if (res.data) {
            localStorage.setItem(CONFIG.STORAGE_KEYS.PROFILE, JSON.stringify(res.data));
            Auth.renderUserNav();
            Utils.showToast('Profile updated successfully!', 'success');
          }
        } catch (err) {
          Utils.showToast(err.message || 'Update failed', 'error');
        }
      });
    });
  </script>
</body>
</html>
