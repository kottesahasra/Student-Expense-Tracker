<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goals | Student Expense Tracker</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <div class="sidebar-brand-title">Student Expense</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Overview</div>
        <a href="dashboard.html" class="nav-item"><span>📊 Dashboard</span></a>
        <a href="transactions.html" class="nav-item"><span>💳 Transactions</span></a>
        <div class="nav-section-label">Planning</div>
        <a href="budgets.html" class="nav-item"><span>🎯 Monthly Budgets</span></a>
        <a href="goals.html" class="nav-item active"><span>🏆 Savings Goals</span></a>
        <a href="recurring.html" class="nav-item"><span>🔄 Subscriptions & Bills</span></a>
        <div class="nav-section-label">Insights</div>
        <a href="analytics.html" class="nav-item"><span>📈 Analytics & Trends</span></a>
        <a href="settings.html" class="nav-item"><span>⚙️ Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar" id="nav-user-avatar">S</div>
          <div class="user-info">
            <div class="user-name" id="nav-user-name">Student</div>
            <div class="user-email" id="nav-user-email">student@campus.edu</div>
          </div>
          <button onclick="Auth.logout()" title="Logout" style="background:none; border:none; color:var(--text-sidebar); cursor:pointer;">🚪</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="app-main">
      <header class="app-header">
        <h2 style="font-size: 1.25rem;">Savings Goals</h2>
        <button class="btn btn-primary" onclick="openNewGoalModal()">+ New Goal</button>
      </header>

      <div class="app-content">
        <!-- Goals Grid -->
        <div id="goals-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6);">
          <div class="card text-center py-6" style="grid-column: 1 / -1;">Loading goals...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Goal Modal -->
  <div class="modal-overlay" id="goal-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Create Savings Goal</h3>
        <button class="modal-close" onclick="Utils.closeModal('goal-modal')">&times;</button>
      </div>
      <form id="goal-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="goal-title">Goal Name</label>
            <input type="text" id="goal-title" class="form-control" placeholder="e.g. Study Abroad, MacBook Pro, Emergency Reserve" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="goal-target">Target Amount</label>
            <input type="number" step="0.01" id="goal-target" class="form-control" placeholder="1000.00" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="goal-current">Starting Amount (Optional)</label>
            <input type="number" step="0.01" id="goal-current" class="form-control" placeholder="0.00" value="0">
          </div>
          <div class="form-group">
            <label class="form-label" for="goal-category">Category</label>
            <input type="text" id="goal-category" class="form-control" placeholder="e.g. Tech, Travel, Emergency">
          </div>
          <div class="form-group">
            <label class="form-label" for="goal-date">Target Date (Optional)</label>
            <input type="date" id="goal-date" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('goal-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Goal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Contribute to Goal Modal -->
  <div class="modal-overlay" id="contribute-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Add Funds to Goal</h3>
        <button class="modal-close" onclick="Utils.closeModal('contribute-modal')">&times;</button>
      </div>
      <form id="contribute-form">
        <input type="hidden" id="contribute-goal-id">
        <div class="modal-body">
          <p class="mb-4">Contributing to: <strong id="contribute-goal-title">Goal</strong></p>
          <div class="form-group">
            <label class="form-label" for="contribute-amount">Deposit Amount</label>
            <input type="number" step="0.01" id="contribute-amount" class="form-control" placeholder="50.00" required autofocus>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('contribute-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm Deposit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/goals.js"></script>
</body>
</html>
